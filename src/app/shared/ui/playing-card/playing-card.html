<span class="halo" [style.opacity]="glow()" [style.scale]="lift()"></span>

<span class="card" [class.card--red]="red()">
  @if (faceDown()) {
    <span class="back">⚜</span>
  } @else {
    <span class="corner corner--tl"
      >{{ rank() }}<i>{{ suit() }}</i></span
    >
    <!-- O emblema é um ícone do baralho quando o nome bate; senão, o texto
         (o naipe, um símbolo ou um emoji vindo do painel). -->
    <span class="center">
      @if (emblemIcon(); as name) {
        <app-icon [name]="name" />
      } @else {
        {{ emblem() ?? suit() }}
      }
    </span>
    <span class="corner corner--br"
      >{{ rank() }}<i>{{ suit() }}</i></span
    >
    <span class="sheen"></span>
  }

  <!-- Camadas holográficas: valem para os dois lados da carta. -->
  <span class="foil"></span>
  <span class="glare"></span>
</span>
