<div class="scrim" (click)="dismiss.emit()"></div>

<article
  class="panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Presente: ' + event().title"
>
  <button #closeButton type="button" class="panel__close" (click)="dismiss.emit()">
    <span class="sr-only">Fechar</span>
    <span aria-hidden="true">✕</span>
  </button>

  <app-playing-card class="panel__card" rank="★" suit="♦" [emblem]="event().icon" [charge]="1" />

  <p class="eyebrow">{{ view().opensAtMs | schedule: 'long' }}</p>
  <h2 class="panel__title kinetic-text">{{ event().title }}</h2>

  <div class="panel__message">
    @for (paragraph of paragraphs(); track $index) {
      <p [style.animation-delay.ms]="120 + $index * 140">{{ paragraph }}</p>
    }
  </div>

  @if (event().letter; as letter) {
    <app-letter-envelope [letter]="letter" [letterId]="event().id" />
  }

  <footer class="panel__foot" [class.panel__foot--solo]="!!event().letter">
    <!-- O botão bate como coração, e cada toque é uma batida mais forte que
         solta a onda e os corações. O naipe é o mesmo do baralho. -->
    <button
      type="button"
      class="thanks"
      [class.is-beating]="beating()"
      (animationend)="calmDown($event)"
      (click)="cheer($event)"
    >
      <span class="thanks__wave" aria-hidden="true"></span>

      <svg class="thanks__heart" viewBox="0 0 32 30" aria-hidden="true">
        <defs>
          <linearGradient id="merciGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff2d95" />
            <stop offset="0.5" stop-color="#e879f9" />
            <stop offset="1" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
        <path
          d="M16 28C7 21 2 16.2 2 10.6 2 6.1 5.4 3 9.3 3c2.6 0 4.9 1.4 6.7 3.6C17.8 4.4 20.1 3 22.7 3 26.6 3 30 6.1 30 10.6 30 16.2 25 21 16 28Z"
        />
      </svg>

      <span class="thanks__label">Merci :&gt;</span>
    </button>

    <!-- Um presente com carta já foi assinado dentro dela: repetir a assinatura
         logo abaixo do "Gambit" da folha soava como duas despedidas seguidas. -->
    @if (!event().letter) {
      <p class="cajun panel__sign">{{ config.signature }}</p>
    }
  </footer>
</article>

<!-- Fora do .panel de propósito: ele rola, e cortaria os corações no caminho. -->
<div class="hearts" aria-hidden="true">
  @for (heart of hearts(); track heart.id) {
    <span
      class="heart heart--{{ heart.variant }}"
      [style.left.px]="heart.x"
      [style.top.px]="heart.y"
      [style.font-size.px]="heart.size"
      [style.animation-delay.ms]="heart.delay"
      [style.animation-duration.ms]="heart.duration"
      (animationend)="retireHeart(heart.id)"
      >♥</span
    >
  }
</div>
